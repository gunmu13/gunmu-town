<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="screen-orientation" content="landscape">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0f0c">
<title>棍母小镇</title>
<style>
/* =========================================================
   棍母小镇 · 全站样式
   配色：铜锈橙 #c8742a / 暗夜绿 #0d0f0c / 面板 #1a1d18
   ========================================================= */

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body {
  width:100%; height:100%;
  background:#0d0f0c;
  color:#d8d4c4;
  font-family:"Courier New", monospace;
  overflow:hidden;
  user-select:none;
}

/* ---------- 竖屏提示 ---------- */
#rotate-tip {
  position:fixed; inset:0; z-index:999;
  background:#0d0f0c;
  display:none;
  flex-direction:column; align-items:center; justify-content:center;
  gap:20px; font-size:20px;
}
#rotate-tip .rotate-icon { font-size:64px; animation:spin 2s infinite; }
@keyframes spin { 0%{transform:rotate(0)} 50%{transform:rotate(90deg)} 100%{transform:rotate(0)} }

#app { display:flex; flex-direction:column; width:100%; height:100%; }

/* ---------- 顶部状态栏 ---------- */
#topbar {
  height:48px; flex:0 0 48px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px;
  background:linear-gradient(180deg,#1a201a,#0d0f0c);
  border-bottom:2px solid #c8742a;
  font-size:14px;
}
#topbar .brand {
  font-weight:bold; letter-spacing:2px; color:#c8742a;
  text-shadow:0 0 8px rgba(200,116,42,.6);
}

#screen { flex:1; position:relative; overflow:hidden; }

.screen {
  position:absolute; inset:0;
  padding:12px;
  overflow-y:auto;
  animation:fadein .25s ease;
}
@keyframes fadein { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
.hidden { display:none !important; }

h2 {
  font-size:18px; color:#c8742a; letter-spacing:2px;
  border-left:4px solid #c8742a; padding-left:8px;
  margin-bottom:10px;
}

/* ---------- 网格 & 物品卡 ---------- */
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(72px,1fr));
  gap:8px;
}

.item {
  position:relative;
  aspect-ratio:1;
  border:2px solid #444;
  border-radius:4px;
  background:#1a1d18;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  font-size:11px;
  cursor:pointer;
  transition:transform .1s;
}
.item:active { transform:scale(.94); }
.item .emoji { font-size:26px; }
.item .price { font-size:10px; color:#c8742a; margin-top:2px; }
.item .lvl { position:absolute; top:2px; left:4px; font-size:10px; opacity:.8; }

/* 等级色 */
.lv1 { border-color:#7a7a7a; }
.lv2 { border-color:#4caf50; box-shadow:inset 0 0 12px rgba(76,175,80,.25); }
.lv3 { border-color:#3d8bfd; box-shadow:inset 0 0 12px rgba(61,139,253,.3); }
.lv4 { border-color:#a45cff; box-shadow:inset 0 0 14px rgba(164,92,255,.35); }
.lv5 { border-color:#ff8c2a; box-shadow:inset 0 0 16px rgba(255,140,42,.4); }
.lv6 { border-color:#ff3b3b; box-shadow:inset 0 0 18px rgba(255,59,59,.5); }
.lv7 {
  border-color:#ffd700;
  box-shadow:0 0 20px rgba(255,215,0,.7), inset 0 0 20px rgba(255,215,0,.5);
  animation:pulse 1.6s infinite;
}
@keyframes pulse {
  0%,100%{ box-shadow:0 0 20px rgba(255,215,0,.7), inset 0 0 20px rgba(255,215,0,.5);}
  50%{ box-shadow:0 0 32px rgba(255,215,0,1), inset 0 0 28px rgba(255,215,0,.8);}
}

/* ---------- 详情面板 ---------- */
.panel {
  position:fixed; right:12px; bottom:80px;
  width:220px;
  background:#161a14;
  border:2px solid #c8742a;
  border-radius:6px;
  padding:12px;
  z-index:50;
  box-shadow:0 0 24px rgba(0,0,0,.8);
}
.panel h3 { font-size:14px; color:#ffd700; margin-bottom:6px; }
.panel p { font-size:12px; line-height:1.6; }
.panel button {
  margin-top:8px; width:100%;
  background:#c8742a; color:#0d0f0c; border:none;
  padding:8px; font-weight:bold; border-radius:4px;
}

/* ---------- 标签页 ---------- */
.tabs { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
.tabs button {
  background:#1a1d18; color:#d8d4c4;
  border:1px solid #444; border-radius:4px;
  padding:6px 12px; font-size:12px;
}
.tabs button.active { background:#c8742a; color:#0d0f0c; border-color:#c8742a; }

/* ---------- 装备槽 ---------- */
.loadout-row { display:flex; gap:8px; margin-bottom:12px; }
.slot {
  flex:1;
  border:2px dashed #444; border-radius:6px;
  padding:12px 6px; text-align:center; font-size:12px;
  min-height:70px;
  display:flex; flex-direction:column; justify-content:center;
  cursor:pointer;
}
.slot.filled { border-style:solid; border-color:#c8742a; background:#1a1d18; }

/* ---------- 地图卡 ---------- */
.map-card {
  background:linear-gradient(135deg,#1a201a,#0d0f0c);
  border:2px solid #c8742a; border-radius:8px;
  padding:20px; text-align:center;
}
.map-name { font-size:26px; color:#c8742a; letter-spacing:4px; margin-bottom:8px; }
.map-desc { font-size:12px; color:#8a8578; margin-bottom:16px; }
.difficulty-row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.difficulty-row button {
  padding:10px 16px; border:1px solid #c8742a; background:#1a1d18;
  color:#c8742a; border-radius:4px; font-size:12px;
}

/* ---------- 局内 HUD ---------- */
#raid-hud {
  position:absolute; top:8px; left:8px; right:8px;
  display:flex; justify-content:space-between;
  font-size:14px; z-index:10;
  pointer-events:none;
}
#raid-timer { font-family:monospace; }

#raid-field {
  position:absolute; inset:0;
  background:
    repeating-linear-gradient(0deg, #1a201a 0 40px, #161a14 40px 80px),
    repeating-linear-gradient(90deg, transparent 0 40px, rgba(200,116,42,.06) 40px 41px);
  overflow:hidden;
  touch-action:none;
}

#player { pointer-events:none; }

.enemy {
  position:absolute;
  width:44px; height:44px;
  border-radius:50%;
  background:radial-gradient(circle,#8a1a1a,#3a0a0a);
  border:2px solid #ff3b3b;
  display:flex; align-items:center; justify-content:center;
  font-size:22px;
  transition:transform .2s;
  cursor:pointer;
}
.enemy.boss {
  background:radial-gradient(circle,#c8742a,#3a1a0a);
  border-color:#ffd700;
  width:56px; height:56px;
}
.enemy.dead { opacity:.3; transform:scale(.6); }

.loot-box {
  position:absolute; width:36px; height:36px;
  background:#2a2a1a; border:2px solid #c8742a;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; border-radius:4px;
  cursor:pointer;
}

.extract-zone {
  position:absolute; width:80px; height:80px;
  border:3px dashed #4caf50; border-radius:50%;
  background:rgba(76,175,80,.1);
  display:flex; align-items:center; justify-content:center;
  font-size:12px; color:#4caf50;
  animation:pulse-g 1.5s infinite;
  cursor:pointer;
}
@keyframes pulse-g { 0%,100%{opacity:.6} 50%{opacity:1} }

#raid-log {
  position:absolute; bottom:60px; left:8px; right:8px;
  font-size:12px; color:#c8742a; text-shadow:0 0 4px #000;
  max-height:80px; overflow:hidden;
  pointer-events:none;
}

#raid-actions {
  position:absolute; bottom:8px; left:8px; right:8px;
  display:flex; gap:8px;
}
#raid-actions button {
  flex:1; padding:12px;
  background:#c8742a; color:#0d0f0c;
  border:none; border-radius:4px; font-weight:bold;
}

/* ---------- 底部导航 ---------- */
#bottomnav {
  height:56px; flex:0 0 56px;
  display:flex; background:#12160f;
  border-top:2px solid #c8742a;
}
#bottomnav button {
  flex:1; background:transparent; color:#8a8578;
  border:none; font-size:13px; letter-spacing:1px;
}
#bottomnav button:active { color:#c8742a; }
</style>
</head>
<body>

<!-- 竖屏提示 -->
<div id="rotate-tip">
  <div class="rotate-icon">📱↻</div>
  <p>请横屏握持手机</p>
</div>

<div id="app">

  <!-- 顶部状态栏 -->
  <header id="topbar">
    <div class="brand">棍母小镇 · GUNMU TOWN</div>
    <div class="stat">💰 <span id="money">0</span> 柯恩币</div>
    <div class="stat">🎒 仓库 <span id="wh-count">0</span> 件</div>
  </header>

  <!-- 主内容区 -->
  <main id="screen">

    <!-- 仓库 -->
    <section id="scr-warehouse" class="screen">
      <h2>仓库</h2>
      <div id="warehouse-grid" class="grid"></div>
      <div id="item-detail" class="panel hidden"></div>
    </section>

    <!-- 市场 -->
    <section id="scr-market" class="screen hidden">
      <h2>市场</h2>
      <div class="tabs">
        <button data-tab="buy-weapon">买枪械</button>
        <button data-tab="buy-armor">买防具</button>
        <button data-tab="buy-med">买药品</button>
        <button data-tab="sell">卖变卖物</button>
      </div>
      <div id="market-body" class="grid"></div>
    </section>

    <!-- 装备 -->
    <section id="scr-loadout" class="screen hidden">
      <h2>装备</h2>
      <div class="loadout-row">
        <div class="slot" id="slot-weapon">主武器<br><span>—</span></div>
        <div class="slot" id="slot-armor">护甲<br><span>—</span></div>
        <div class="slot" id="slot-helmet">头盔<br><span>—</span></div>
        <div class="slot" id="slot-meds">药品<br><span>—</span></div>
      </div>
      <div id="loadout-picker" class="grid"></div>
    </section>

    <!-- 任务（扩展 6） -->
    <section id="scr-quest" class="screen hidden">
      <h2>任务</h2>
    </section>

    <!-- 地图（扩展 8：多地图，由 JS 渲染） -->
    <section id="scr-map" class="screen hidden">
      <h2>选择地图</h2>
    </section>

    <!-- 局内 -->
    <section id="scr-raid" class="screen hidden">
      <div id="raid-hud">
        <div>❤️ <span id="hp">100</span></div>
        <div>🪙 <span id="raid-loot">0</span></div>
        <div id="raid-timer">05:00</div>
      </div>
      <div id="raid-field"></div>
      <div id="raid-log"></div>
      <div id="raid-actions">
        <button id="btn-search">搜索 (E)</button>
        <button id="btn-extract">撤离</button>
      </div>
    </section>

    <!-- 结算 -->
    <section id="scr-result" class="screen hidden">
      <h2 id="result-title">撤离成功</h2>
      <div id="result-body"></div>
      <button id="btn-back" style="margin-top:16px;padding:12px 24px;background:#c8742a;color:#0d0f0c;border:none;border-radius:4px;font-weight:bold">返回大厅</button>
    </section>

  </main>

  <!-- 底部导航（5 个入口，含"任务"扩展） -->
  <nav id="bottomnav">
    <button data-go="warehouse">仓库</button>
    <button data-go="market">市场</button>
    <button data-go="loadout">装备</button>
    <button data-go="quest">任务</button>
    <button data-go="map">进入地图</button>
  </nav>

</div>

<script src="game.js"></script>
</body>
</html>
