name: Build & Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 先解压，并定位 pom.xml 所在目录
      - name: Extract zip & locate pom.xml
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then
            echo "SRC_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi
          ZIP="${zips[0]}"
          mkdir -p _extracted
          # 跨平台解压：Linux/macOS 用 unzip，Windows 回退 7z
          if command -v unzip >/dev/null 2>&1; then
            unzip -q -o "$ZIP" -d _extracted
          else
            7z x -y "$ZIP" -o_extracted
          fi
          POM=$(find _extracted -name pom.xml -maxdepth 4 | head -n1)
          if [ -z "$POM" ]; then
            echo "::error::zip 里没有找到 pom.xml"
            exit 1
          fi
          SRC_DIR=$(dirname "$POM")
          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"
          echo "找到源码根目录: $SRC_DIR"

      # 2. 再配置 Java（此时 pom.xml 已存在，缓存可以正常命中）
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ env.SRC_DIR }}/pom.xml

      # 3. 构建
      - name: Build with Maven
        shell: bash
        run: |
          cd "$SRC_DIR"
          mvn -B -DskipTests clean package

      # 4. 打包（可选，按需保留）
      - name: Package with jpackage
        shell: bash
        run: |
          cd "$SRC_DIR"
          rm -rf dist-input dist
          mkdir -p dist-input
          cp target/game.jar dist-input/
          if [ -d assets ]; then
            cp -r assets dist-input/
          fi
          jpackage --type app-image \
            --name HighQualityJavaGame \
            --input dist-input \
            --main-jar game.jar \
            --main-class com.example.game.GameApp \
            --java-options "-XX:+UseZGC" \
            --java-options "-Xms2G" \
            --java-options "-Xmx4G" \
            --dest dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HighQualityJavaGame-${{ matrix.os }}
          path: ${{ env.SRC_DIR }}/dist
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
