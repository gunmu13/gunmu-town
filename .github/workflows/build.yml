name: Build & Package

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ---------- 1. 自动解压仓库里的 zip ----------
      - name: Extract uploaded zip (if any)
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip found, build from repo root."
            echo "SRC_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          ZIP="${zips[0]}"
          echo "Found zip: $ZIP"
          mkdir -p _extracted

          if command -v unzip >/dev/null 2>&1; then
            unzip -q -o "$ZIP" -d _extracted
          else
            # Windows runner 回退到 7z
            7z x -y "$ZIP" -o_extracted
          fi

          POM=$(find _extracted -name pom.xml -maxdepth 4 | head -n1)
          if [ -z "$POM" ]; then
            echo "::error::zip 里没有找到 pom.xml，无法定位源码根目录"
            exit 1
          fi

          SRC_ROOT=$(dirname "$POM")
          echo "Source root: $SRC_ROOT"
          echo "SRC_DIR=$SRC_ROOT" >> "$GITHUB_ENV"

      # ---------- 2. Maven 构建 ----------
      - name: Build with Maven
        shell: bash
        run: |
          cd "$SRC_DIR"
          mvn -B -DskipTests clean package

      # ---------- 3. jpackage 打包 ----------
      - name: Package with jpackage
        shell: bash
        run: |
          cd "$SRC_DIR"
          rm -rf dist-input dist
          mkdir -p dist-input
          cp target/game.jar dist-input/
          if [ -d assets ]; then
            cp -r assets dist-input/
          fi

          jpackage --type app-image \
            --name HighQualityJavaGame \
            --input dist-input \
            --main-jar game.jar \
            --main-class com.example.game.GameApp \
            --java-options "-XX:+UseZGC" \
            --java-options "-Xms2G" \
            --java-options "-Xmx4G" \
            --dest dist

      # ---------- 4. 上传产物 ----------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HighQualityJavaGame-${{ matrix.os }}
          path: ${{ env.SRC_DIR }}/dist
          if-no-files-found: error
          retention-days: 7
          compression-level: 0   # jar + 资源已压缩过，再压收益极低
